<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mayavi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-primary: #0d0d0d;
    --bg-secondary: #151515;
    --bg-tertiary: #1f1f1f;
    --accent: #00ff88;
    --accent-dim: #00cc6a;
    --accent-glow: rgba(0, 255, 136, 0.3);
    --text-primary: #ffffff;
    --text-secondary: #b4b4b4;
    --text-dim: #6a6a6a;
    --border: #333333;
    --danger: #ff3366;
    --warning: #ffaa00;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
    height: 100vh;
}

.app-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: 
        "header sidebar"
        "main sidebar"
        "footer sidebar";
    height: 100vh;
    gap: 0;
}

.header-section {
    grid-area: header;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(45deg, var(--accent), #00ccff);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    color: var(--bg-primary);
}

.brand-text h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--text-primary), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-text p {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin: 0;
    font-weight: 400;
}

.header-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
}

.status-indicator {
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    border: 1px solid var(--border);
}

.status-indicator.active {
    background: var(--accent-glow);
    color: var(--accent);
    border-color: var(--accent);
    animation: statusPulse 2s infinite;
}

@keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
}

.settings-trigger {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.settings-trigger:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
}

.main-content {
    grid-area: main;
    background: var(--bg-primary);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

.conversation-view {
    flex: 1;
    padding: 2rem;
    overflow-y: auto;
    background: 
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 204, 255, 0.05) 0%, transparent 50%);
}

.chat-bubble {
    max-width: 70%;
    margin-bottom: 1.5rem;
    animation: bubbleIn 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@keyframes bubbleIn {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.chat-bubble.user {
    margin-left: auto;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: var(--bg-primary);
    padding: 1rem 1.5rem;
    border-radius: 25px 25px 5px 25px;
    font-weight: 500;
    box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
}

.chat-bubble.assistant {
    background: var(--bg-secondary);
    color: var(--text-primary);
    padding: 1rem 1.5rem;
    border-radius: 25px 25px 25px 5px;
    border: 1px solid var(--border);
    position: relative;
}

.chat-bubble.assistant::before {
    content: '';
    position: absolute;
    left: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--accent);
    border-radius: 2px;
}

.control-center {
    grid-area: footer;
    background: var(--bg-secondary);
    border-top: 1px solid var(--border);
    padding: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.voice-control {
    position: relative;
}

.record-orb {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(45deg, var(--accent), #00ccff);
    border: none;
    color: var(--bg-primary);
    font-size: 2.5rem;
    cursor: pointer;
    position: relative;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 
        0 0 0 0 var(--accent-glow),
        0 10px 40px rgba(0, 255, 136, 0.3);
}

.record-orb:hover {
    transform: scale(1.05);
    box-shadow: 
        0 0 0 10px var(--accent-glow),
        0 15px 50px rgba(0, 255, 136, 0.4);
}

.record-orb.recording {
    background: linear-gradient(45deg, var(--danger), #ff6b9d);
    animation: recordPulse 1.5s infinite;
}

@keyframes recordPulse {
    0%, 100% {
        box-shadow: 
            0 0 0 0 rgba(255, 51, 102, 0.4),
            0 10px 40px rgba(255, 51, 102, 0.3);
    }
    50% {
        box-shadow: 
            0 0 0 20px rgba(255, 51, 102, 0),
            0 15px 50px rgba(255, 51, 102, 0.4);
    }
}

.sidebar-panel {
    grid-area: sidebar;
    background: var(--bg-secondary);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 2rem 1.5rem;
    gap: 2rem;
}

.panel-section h3 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.quick-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.stat-card {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    text-align: center;
}

.stat-number {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
}

.stat-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.activity-feed {
    flex: 1;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    overflow-y: auto;
}

.activity-item {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
}

.activity-item:last-child {
    border-bottom: none;
}

.activity-icon {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-glow);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
}

.activity-text {
    font-size: 0.8rem;
    color: var(--text-secondary);
    line-height: 1.3;
}

.branding-link {
    position: fixed;
    bottom: 1rem;
    left: 1rem;
    background: rgba(21, 21, 21, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.75rem;
    font-weight: 500;
    transition: all 0.2s ease;
    z-index: 1000;
}

.branding-link:hover {
    color: var(--accent);
    border-color: var(--accent);
    text-decoration: none;
}

.modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 16px;
    color: var(--text-primary);
}

.modal-header {
    border-bottom: 1px solid var(--border);
    background: var(--bg-tertiary);
    border-radius: 16px 16px 0 0;
}

.modal-title {
    color: var(--text-primary);
    font-weight: 600;
}

.btn-close {
    filter: invert(1);
    opacity: 0.6;
}

.btn-close:hover {
    opacity: 1;
}

.form-label {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.9rem;
}

.form-control {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: 'Space Grotesk', monospace;
}

.form-control:focus {
    background: var(--bg-primary);
    border-color: var(--accent);
    box-shadow: 0 0 0 0.2rem var(--accent-glow);
    color: var(--text-primary);
}

.form-control::placeholder {
    color: var(--text-dim);
}

.btn-primary {
    background: linear-gradient(45deg, var(--accent), var(--accent-dim));
    border: none;
    color: var(--bg-primary);
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
}

.btn-primary:hover {
    background: linear-gradient(45deg, var(--accent-dim), var(--accent));
    color: var(--bg-primary);
}

.btn-secondary {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-weight: 500;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
}

.btn-secondary:hover {
    background: var(--bg-primary);
    border-color: var(--accent);
    color: var(--text-primary);
}

@media (max-width: 1200px) {
    .app-grid {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto auto;
        grid-template-areas: 
            "header"
            "main"
            "footer"
            "sidebar";
    }
    
    .sidebar-panel {
        border-left: none;
        border-top: 1px solid var(--border);
        flex-direction: row;
        gap: 1rem;
        padding: 1rem;
    }
    
    .panel-section {
        flex: 1;
    }
    
    .quick-stats {
        grid-template-columns: 1fr;
        gap: 0.5rem;
    }
    
    .activity-feed {
        max-height: 200px;
    }
}

@media (max-width: 768px) {
    .header-section {
        padding: 1rem;
    }
    
    .brand-text h1 {
        font-size: 1.5rem;
    }
    
    .brand-text p {
        display: none;
    }
    
    .conversation-view {
        padding: 1rem;
    }
    
    .chat-bubble {
        max-width: 90%;
    }
    
    .control-center {
        padding: 1.5rem;
    }
    
    .record-orb {
        width: 100px;
        height: 100px;
        font-size: 2rem;
    }
    
    .sidebar-panel {
        flex-direction: column;
        gap: 1rem;
    }
    
    .branding-link {
        position: relative;
        bottom: auto;
        left: auto;
        margin: 1rem 0;
    }
}
    </style>
</head>
<body>
    <div class="app-grid">
        <header class="header-section">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <div class="brand-text">
                    <h1>Mayavi</h1>
                    <p>Machine-based Assistant for Research, Voice, and Interactive Services</p>
                </div>
            </div>
            <div class="header-controls">
                <div id="statusDisplay" class="status-indicator">Ready</div>
                <button id="settingsBtn" class="settings-trigger">
                    <i class="fas fa-sliders-h"></i>
                </button>
            </div>
        </header>

        <main class="main-content">
            <div id="chat-log" class="conversation-view"></div>
        </main>

        <footer class="control-center">
            <div class="voice-control">
                <button id="recordBtn" class="record-orb">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>
        </footer>

        <aside class="sidebar-panel">
            <div class="panel-section">
                <h3>Session Stats</h3>
                <div class="quick-stats">
                    <div class="stat-card">
                        <div class="stat-number">0</div>
                        <div class="stat-label">Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">0s</div>
                        <div class="stat-label">Talk Time</div>
                    </div>
                </div>
            </div>
            
            <div class="panel-section">
                <h3>Activity</h3>
                <div class="activity-feed">
                    <div class="activity-item">
                        <div class="activity-icon">
                            <i class="fas fa-power-off"></i>
                        </div>
                        <div class="activity-text">Mayavi initialized and ready</div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <a href="https://murf.ai/api/docs/introduction/overview" target="_blank" class="branding-link">
        <i class="fas fa-bolt"></i> Powered by Murf
    </a>

    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-cog me-2"></i>API Configuration
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="murfApiKey" class="form-label">
                            <i class="fas fa-volume-up me-2"></i>MURF API Key
                        </label>
                        <input type="password" class="form-control" id="murfApiKey" placeholder="Enter your Murf API key">
                    </div>
                    <div class="mb-3">
                        <label for="assemblyAiApiKey" class="form-label">
                            <i class="fas fa-microphone me-2"></i>AssemblyAI API Key
                        </label>
                        <input type="password" class="form-control" id="assemblyAiApiKey" placeholder="Enter your AssemblyAI API key">
                    </div>
                    <div class="mb-3">
                        <label for="geminiApiKey" class="form-label">
                            <i class="fas fa-brain me-2"></i>Gemini API Key
                        </label>
                        <input type="password" class="form-control" id="geminiApiKey" placeholder="Enter your Gemini API key">
                    </div>
                    <div class="mb-3">
                        <label for="serpApiKey" class="form-label">
                            <i class="fas fa-search me-2"></i>SerpAPI API Key
                        </label>
                        <input type="password" class="form-control" id="serpApiKey" placeholder="Enter your SerpAPI API key">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveKeysBtn">Save Configuration</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
    const recordBtn = document.getElementById("recordBtn");
    const statusDisplay = document.getElementById("statusDisplay");
    const chatLog = document.getElementById('chat-log');
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsModal = new bootstrap.Modal(document.getElementById('settingsModal'));
    const saveKeysBtn = document.getElementById("saveKeysBtn");

    let isRecording = false;
    let ws = null;
    let audioContext;
    let mediaStream;
    let processor;
    let audioQueue = [];
    let isPlaying = false;
    let assistantMessageDiv = null;
    let messageCount = 0;
    let sessionStartTime = Date.now();
    let totalTalkTime = 0;

    // Activity tracking
    const addActivity = (text, icon = "info-circle") => {
        const activityFeed = document.querySelector('.activity-feed');
        const item = document.createElement('div');
        item.className = 'activity-item';
        item.innerHTML = `
            <div class="activity-icon">
                <i class="fas fa-${icon}"></i>
            </div>
            <div class="activity-text">${text}</div>
        `;
        activityFeed.insertBefore(item, activityFeed.firstChild);
        
        // Keep only last 10 items
        while (activityFeed.children.length > 10) {
            activityFeed.removeChild(activityFeed.lastChild);
        }
    };

    // Update stats
    const updateStats = () => {
        const statCards = document.querySelectorAll('.stat-card');
        statCards[0].querySelector('.stat-number').textContent = messageCount;
        
        const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
        statCards[1].querySelector('.stat-number').textContent = `${elapsed}s`;
    };

    // Load saved API keys
    const loadSettings = () => {
        document.getElementById("murfApiKey").value = localStorage.getItem("murfApiKey") || "";
        document.getElementById("assemblyAiApiKey").value = localStorage.getItem("assemblyAiApiKey") || "";
        document.getElementById("geminiApiKey").value = localStorage.getItem("geminiApiKey") || "";
        document.getElementById("serpApiKey").value = localStorage.getItem("serpApiKey") || "";
    };

    loadSettings();

    settingsBtn.addEventListener("click", () => {
        settingsModal.show();
        addActivity("Settings panel opened", "cog");
    });

    saveKeysBtn.addEventListener("click", () => {
        localStorage.setItem("murfApiKey", document.getElementById("murfApiKey").value);
        localStorage.setItem("assemblyAiApiKey", document.getElementById("assemblyAiApiKey").value);
        localStorage.setItem("geminiApiKey", document.getElementById("geminiApiKey").value);
        localStorage.setItem("serpApiKey", document.getElementById("serpApiKey").value);
        
        settingsModal.hide();
        addActivity("API keys saved successfully", "check");
        
        statusDisplay.textContent = "Configuration Saved";
        statusDisplay.style.color = "var(--accent)";
        setTimeout(() => {
            statusDisplay.textContent = "Ready";
            statusDisplay.style.color = "";
        }, 2000);
    });

    const addOrUpdateMessage = (text, type) => {
        messageCount++;
        updateStats();
        
        const bubble = document.createElement('div');
        bubble.className = `chat-bubble ${type}`;
        bubble.textContent = text;
        chatLog.appendChild(bubble);
        chatLog.scrollTop = chatLog.scrollHeight;
        
        if (type === "assistant") {
            assistantMessageDiv = bubble;
            addActivity("Assistant response received", "robot");
        } else {
            assistantMessageDiv = null;
            addActivity("User message sent", "user");
        }
    };

    const playNextInQueue = () => {
        if (audioQueue.length > 0) {
            isPlaying = true;
            const base64Audio = audioQueue.shift();
            const audioData = Uint8Array.from(atob(base64Audio), c => c.charCodeAt(0)).buffer;
            
            audioContext.decodeAudioData(audioData).then(buffer => {
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                source.onended = playNextInQueue;
                source.start();
            }).catch(e => {
                console.error("Error decoding audio data:", e);
                playNextInQueue();
            });
        } else {
            isPlaying = false;
        }
    };

    const startRecording = async () => {
        const apiKeys = {
            murf: localStorage.getItem("murfApiKey"),
            assemblyai: localStorage.getItem("assemblyAiApiKey"),
            gemini: localStorage.getItem("geminiApiKey"),
            serpapi: localStorage.getItem("serpApiKey")
        };

        const missingKeys = Object.entries(apiKeys)
            .filter(([key, value]) => !value)
            .map(([key]) => key.toUpperCase());

        if (missingKeys.length > 0) {
            statusDisplay.textContent = `Missing: ${missingKeys.join(', ')}`;
            statusDisplay.style.color = "var(--danger)";
            addActivity(`Missing API keys: ${missingKeys.join(', ')}`, "exclamation-triangle");
            settingsModal.show();
            return;
        }

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({ 
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                } 
            });
            
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(mediaStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            source.connect(processor);
            processor.connect(audioContext.destination);
            
            processor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0);
                const pcmData = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 32767;
                }
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(pcmData.buffer);
                }
            };

            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: "config", keys: apiKeys }));
                addActivity("WebSocket connection established", "plug");
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === "assistant") {
                    addOrUpdateMessage(msg.text, "assistant");
                } else if (msg.type === "final") {
                    addOrUpdateMessage(msg.text, "user");
                } else if (msg.type === "audio") {
                    audioQueue.push(msg.b64);
                    if (!isPlaying) {
                        playNextInQueue();
                    }
                }
            };

            ws.onerror = (error) => {
                addActivity("Connection error occurred", "exclamation-triangle");
            };

            isRecording = true;
            recordBtn.classList.add("recording");
            statusDisplay.textContent = "Listening...";
            statusDisplay.classList.add("active");
            addActivity("Voice recording started", "microphone");

        } catch (error) {
            console.error("Could not start recording:", error);
            statusDisplay.textContent = "Microphone Denied";
            statusDisplay.style.color = "var(--danger)";
            addActivity("Microphone access denied", "microphone-slash");
        }
    };

    const stopRecording = () => {
        try {
            if (processor) processor.disconnect();
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            if (ws) {
                ws.close();
            }
        } catch (error) {
            console.error("Error stopping recording:", error);
        }
        
        isRecording = false;
        recordBtn.classList.remove("recording");
        statusDisplay.textContent = "Ready";
        statusDisplay.classList.remove("active");
        statusDisplay.style.color = "";
        addActivity("Voice recording stopped", "stop");
    };

    recordBtn.addEventListener("click", () => {
        if (isRecording) {
            stopRecording();
        } else {
            startRecording();
        }
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && !e.target.matches("input, textarea")) {
            e.preventDefault();
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        }
    });

    // Initialize
    setTimeout(() => {
        addOrUpdateMessage("Hello! I'm Mayavi, your intelligent voice assistant. Press the microphone button or spacebar to start our conversation.", "assistant");
    }, 1500);

    // Update stats every second
    setInterval(updateStats, 1000);

    // Cleanup
    window.addEventListener("beforeunload", () => {
        stopRecording();
    });
});
    </script>
</body>
</html>
