<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Voice Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0f172a',
            secondary: '#1e293b',
            accent: '#22d3ee',
            'accent-dark': '#0ea5e9',
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'ping-slow': 'ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite',
          }
        }
      }
    }
  </script>
  <style>
    @keyframes wave {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-wave {
      animation: wave 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-primary text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-secondary rounded-xl shadow-2xl p-6 flex flex-col h-[85vh]">
    <header class="text-center mb-6">
      <h1 class="text-accent text-3xl font-bold">Voice Assistant</h1>
      <p class="text-gray-400 mt-1">Streaming audio via WebSocket</p>
    </header>

    <!-- Chat History -->
    <div id="chat-box" class="flex-1 bg-gray-800/50 rounded-xl p-4 overflow-y-auto space-y-4 mb-6">
      <div class="text-center text-gray-400 py-8">
        <p>Press the microphone button to start streaming audio</p>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex flex-col items-center">
      <button id="record-btn" class="w-16 h-16 rounded-full bg-accent hover:bg-accent-dark text-primary flex items-center justify-center text-2xl shadow-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-accent focus:ring-opacity-50">
        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <p id="status-text" class="mt-3 text-sm text-gray-400">Ready</p>
    </div>
  </div>

  <audio id="bot-audio" class="hidden"></audio>

<script>
  // Generate or retrieve session ID
  const SESSION_ID = localStorage.getItem('voiceAgentSessionId') || crypto.randomUUID();
  localStorage.setItem('voiceAgentSessionId', SESSION_ID);

  // DOM elements
  const recordBtn = document.getElementById('record-btn');
  const statusText = document.getElementById('status-text');
  const chatBox = document.getElementById('chat-box');

  // State
  let recorder, isRecording = false;
  let socket = null;

  // Add message to chat
  function addMessage(role, text) {
    if (chatBox.children.length === 1 && chatBox.children[0].classList.contains('text-center')) {
      chatBox.innerHTML = '';
    }
    const msgDiv = document.createElement('div');
    msgDiv.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
    
    const bubble = document.createElement('div');
    bubble.className = role === 'user' 
      ? 'bg-accent text-primary px-4 py-3 rounded-2xl rounded-br-none max-w-[80%]'
      : 'bg-gray-700 text-gray-200 px-4 py-3 rounded-2xl rounded-bl-none max-w-[80%]';
    
    bubble.textContent = text;
    msgDiv.appendChild(bubble);
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // Start recording and streaming
  async function startRecording() {
    try {
      // Connect WebSocket
      const wsUrl = `ws://${window.location.host}/ws/audio/${SESSION_ID}`;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        console.log('WebSocket connected');
        statusText.textContent = "🎤 Streaming...";
        addMessage('user', '🎤 Audio stream started...');
      };

      socket.onerror = (err) => console.error('WebSocket error:', err);
      socket.onclose = (e) => console.log('WebSocket closed:', e);

      // Start recording
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

      // Send chunks every 500ms
      recorder.ondataavailable = (e) => {
        if (e.data.size > 0 && socket?.readyState === WebSocket.OPEN) {
          socket.send(e.data);
        }
      };

      recorder.start(500); // Send every 500ms
      isRecording = true;
      recordBtn.classList.add('animate-wave', 'bg-red-500');
    } catch (err) {
      console.error('Microphone access failed:', err);
      statusText.textContent = 'Mic error';
      setTimeout(() => statusText.textContent = 'Ready', 2000);
    }
  }

  // Stop recording
  function stopRecording() {
    if (recorder && isRecording) {
      recorder.stop();
      recorder.stream.getTracks().forEach(t => t.stop()); // Stop mic
      isRecording = false;
    }

    // Let server close naturally — or keep open
    if (socket) {
      // Don't close immediately — let server finish
      // socket.close(); // ❌ Remove this
    }

    recordBtn.classList.remove('animate-wave', 'bg-red-500');
    statusText.textContent = "Audio streamed!";
  }

  // Toggle recording
  recordBtn.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });
</script>

</body>
</html>
