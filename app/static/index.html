<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Day 18: AssemblyAI Turn Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-4xl bg-gray-800 rounded-xl p-8">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-cyan-400 mb-2">
        🎙️ Day 18: Turn Detection
      </h1>
      <p class="text-gray-400">AssemblyAI WebSocket Streaming with Turn Detection (Final Transcripts Only)</p>
      <div class="mt-4 text-sm bg-gray-700 rounded p-3">
        <strong>Format:</strong> 16kHz, 16-bit, Mono PCM
      </div>
    </header>

    <!-- Transcription Display -->
    <div id="transcripts" class="bg-gray-900 rounded-lg p-6 h-96 overflow-y-auto mb-6">
      <div class="text-center text-gray-500 py-20">
        <div class="text-6xl mb-4">🎧</div>
        <p>Click Start to begin real-time transcription with turn detection</p>
      </div>
    </div>

    <!-- Status -->
    <div class="text-center mb-6">
      <div id="status" class="text-lg font-medium">Ready</div>
      <div id="connection" class="text-sm text-gray-500 mt-1">Disconnected</div>
    </div>

    <!-- Controls -->
    <div class="text-center">
      <button id="startBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg">
        🎤 Start Recording
      </button>
      <button id="stopBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg ml-4" disabled>
        ⏹️ Stop Recording
      </button>
    </div>
  </div>

<script>
const SESSION_ID = 'day18-' + Date.now();
const transcriptsDiv = document.getElementById('transcripts');
const statusDiv = document.getElementById('status');
const connectionDiv = document.getElementById('connection');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let socket = null;
let audioContext = null;
let mediaStream = null;
let processor = null;
let isRecording = false;
let transcriptCount = 0;

// Clear placeholder
function clearPlaceholder() {
    if (transcriptsDiv.querySelector('.text-center')) {
        transcriptsDiv.innerHTML = '';
    }
}

// Add transcript with appropriate styling
function addTranscript(type, text) {
    clearPlaceholder();
    
    const div = document.createElement('div');
    // Only show final transcriptions with green background
    div.className = 'mb-3 p-3 rounded bg-green-900 border-l-4 border-green-400 shadow';
    
    const time = new Date().toLocaleTimeString();
    
    div.innerHTML = `
        <div class="text-xs text-gray-400 mb-1">✅ FINAL - ${time}</div>
        <div class="text-lg">${text}</div>
    `;
    
    transcriptsDiv.appendChild(div);
    transcriptsDiv.scrollTop = transcriptsDiv.scrollHeight;
    
    transcriptCount++;
    console.log(`🎯 TRANSCRIPT #${transcriptCount}: ${text}`);
}

// Convert float32 array to 16-bit PCM
function floatTo16BitPCM(float32Array) {
    const buffer = new ArrayBuffer(float32Array.length * 2);
    const view = new DataView(buffer);
    for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    }
    return buffer;
}

// Resample audio to 16kHz
function resampleTo16kHz(inputData, inputSampleRate) {
    const targetSampleRate = 16000;
    if (inputSampleRate === targetSampleRate) return inputData;
    
    const ratio = inputSampleRate / targetSampleRate;
    const outputLength = Math.round(inputData.length / ratio);
    const output = new Float32Array(outputLength);
    
    for (let i = 0; i < outputLength; i++) {
        const index = i * ratio;
        const indexInt = Math.floor(index);
        const fraction = index - indexInt;
        
        if (indexInt + 1 < inputData.length) {
            output[i] = inputData[indexInt] * (1 - fraction) + inputData[indexInt + 1] * fraction;
        } else {
            output[i] = inputData[indexInt];
        }
    }
    
    return output;
}

// Start recording
async function startRecording() {
    try {
        console.log('🎤 Starting recording...');
        statusDiv.textContent = 'Connecting...';
        
        // Create WebSocket connection
        socket = new WebSocket(`ws://${location.host}/ws/transcribe/${SESSION_ID}`);
        
        socket.onopen = () => {
            connectionDiv.textContent = 'Connected';
            connectionDiv.className = 'text-sm text-green-400 mt-1';
            console.log('✅ WebSocket connected');
        };
        
        socket.onmessage = (event) => {
            const msg = event.data;
            if (msg.startsWith('✅')) {
                addTranscript('final', msg.substring(2).trim());
            } else {
                // Handle other messages (errors, status) if needed
                console.log('Info message:', msg);
            }
        };
        
        socket.onerror = (error) => {
            console.error('❌ WebSocket error:', error);
            connectionDiv.textContent = 'Connection Error';
            connectionDiv.className = 'text-sm text-red-400 mt-1';
        };
        
        socket.onclose = () => {
            connectionDiv.textContent = 'Disconnected';
            connectionDiv.className = 'text-sm text-gray-500 mt-1';
            console.log('🔌 WebSocket closed');
        };
        
        // Get microphone access
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: {
                sampleRate: 16000,
                channelCount: 1,
                echoCancellation: true,
                noiseSuppression: true
            }
        });
        
        // Create audio context
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaStreamSource(mediaStream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);
        
        processor.onaudioprocess = (e) => {
            if (!isRecording || !socket || socket.readyState !== WebSocket.OPEN) {
                return;
            }
            
            const inputData = e.inputBuffer.getChannelData(0);
            const resampled = resampleTo16kHz(inputData, audioContext.sampleRate);
            const pcmData = floatTo16BitPCM(resampled);
            socket.send(pcmData);
        };
        
        source.connect(processor);
        processor.connect(audioContext.destination);
        
        isRecording = true;
        statusDiv.textContent = '🎤 Recording...';
        startBtn.disabled = true;
        stopBtn.disabled = false;
        
        console.log('✅ Recording started');
        console.log(`📊 Sample Rate: ${audioContext.sampleRate}Hz`);
        
    } catch (error) {
        console.error('❌ Error starting:', error);
        statusDiv.textContent = 'Error: ' + error.message;
        connectionDiv.textContent = 'Error';
        connectionDiv.className = 'text-sm text-red-400 mt-1';
    }
}

// Stop recording
function stopRecording() {
    console.log('⏹️ Stopping recording...');
    isRecording = false;
    
    if (socket) {
        socket.close();
        socket = null;
    }
    
    if (processor) {
        processor.disconnect();
        processor = null;
    }
    
    if (audioContext) {
        audioContext.close();
        audioContext = null;
    }
    
    if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
    }
    
    statusDiv.textContent = 'Stopped';
    startBtn.disabled = false;
    stopBtn.disabled = true;
    
    console.log('✅ Recording stopped');
    console.log(`📊 Total transcripts: ${transcriptCount}`);
}

// Event listeners
startBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click', stopRecording);

// Cleanup on page unload
window.addEventListener('beforeunload', () => {
    if (isRecording) stopRecording();
});

console.log('🚀 Day 18: AssemblyAI Turn Detection Ready!');
console.log(`📱 Session: ${SESSION_ID}`);
</script>
</body>
</html>
