<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Day 21: Streaming Audio to Client</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-4xl bg-gray-800 rounded-xl p-8">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-cyan-400 mb-2">
        🎙️ Day 21: Streaming Audio to Client
      </h1>
      <p class="text-gray-400">Real-Time Voice Agent with Base64 Audio Streaming</p>
      <div class="mt-4 text-sm bg-gray-700 rounded p-3">
        <strong>Format:</strong> 16kHz PCM → LLM → TTS (base64 audio streamed)
      </div>
    </header>

    <!-- Transcription & Response Display -->
    <div id="transcripts" class="bg-gray-900 rounded-lg p-6 h-80 overflow-y-auto mb-6">
      <div class="text-center text-gray-500 py-20">
        <div class="text-6xl mb-4">🎧</div>
        <p>Click Start to begin. Audio responses will stream in real time.</p>
      </div>
    </div>

    <!-- Audio Player (Optional) -->
    <div class="mb-6 text-center">
      <button id="playAudioBtn" class="hidden bg-green-600 hover:bg-green-700 text-white py-2 px-6 rounded" disabled>
        ▶️ Play Response Audio
      </button>
    </div>

    <!-- Status -->
    <div class="text-center mb-6">
      <div id="status" class="text-lg font-medium">Ready</div>
      <div id="connection" class="text-sm text-gray-500 mt-1">Disconnected</div>
    </div>

    <!-- Controls -->
    <div class="text-center">
      <button id="startBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg">
        🎤 Start Recording
      </button>
      <button id="stopBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-4 px-8 rounded-full text-xl shadow-lg ml-4" disabled>
        ⏹️ Stop Recording
      </button>
    </div>
  </div>

<script>
// Unique session ID
const SESSION_ID = 'day21-' + Date.now();

// DOM Elements
const transcriptsDiv = document.getElementById('transcripts');
const statusDiv = document.getElementById('status');
const connectionDiv = document.getElementById('connection');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const playAudioBtn = document.getElementById('playAudioBtn');

// State
let socket = null;
let audioContext = null;
let mediaStream = null;
let processor = null;
let isRecording = false;
let transcriptCount = 0;
let audioChunks = []; // 🔥 To accumulate base64 audio chunks

// Clear placeholder message
function clearPlaceholder() {
  if (transcriptsDiv.querySelector('.text-center')) {
    transcriptsDiv.innerHTML = '';
  }
}

// Add message to transcript UI
function addMessage(type, text) {
  clearPlaceholder();
  const isUser = type === 'user';
  const bgColor = isUser ? 'bg-blue-900 border-blue-400' : 'bg-green-900 border-green-400';
  const alignClass = isUser ? 'ml-16 mr-2' : 'mr-16 ml-2';
  const side = isUser ? 'left' : 'right';

  const div = document.createElement('div');
  div.className = `mb-4 p-4 rounded ${bgColor} border-l-4 shadow-sm ${alignClass}`;
  div.style.float = side;
  div.style.clear = side;

  const time = new Date().toLocaleTimeString();
  div.innerHTML = `
    <div class="text-xs text-gray-300 mb-1">${isUser ? '👤 You' : '🤖 AI'} • ${time}</div>
    <div class="text-lg">${text}</div>
  `;

  transcriptsDiv.appendChild(div);
  transcriptsDiv.scrollTop = transcriptsDiv.scrollHeight;
}

// Convert Float32Array to 16-bit PCM
function floatTo16BitPCM(float32Array) {
  const buffer = new ArrayBuffer(float32Array.length * 2);
  const view = new DataView(buffer);
  for (let i = 0; i < float32Array.length; i++) {
    const s = Math.max(-1, Math.min(1, float32Array[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return buffer;
}

// Resample audio to 16kHz
function resampleTo16kHz(inputData, inputSampleRate) {
  const targetSampleRate = 16000;
  if (inputSampleRate === targetSampleRate) return inputData;

  const ratio = inputSampleRate / targetSampleRate;
  const outputLength = Math.round(inputData.length / ratio);
  const output = new Float32Array(outputLength);

  for (let i = 0; i < outputLength; i++) {
    const index = i * ratio;
    const indexInt = Math.floor(index);
    const fraction = index - indexInt;

    if (indexInt + 1 < inputData.length) {
      output[i] = inputData[indexInt] * (1 - fraction) + inputData[indexInt + 1] * fraction;
    } else {
      output[i] = inputData[indexInt];
    }
  }

  return output;
}

// Start Recording & Connect WebSocket
async function startRecording() {
  try {
    console.log('🎤 Starting recording session:', SESSION_ID);
    statusDiv.textContent = 'Connecting...';

    // Connect to WebSocket
    socket = new WebSocket(`ws://${location.host}/ws/transcribe/${SESSION_ID}`);

    socket.onopen = () => {
      connectionDiv.textContent = 'Connected';
      connectionDiv.className = 'text-sm text-green-400 mt-1';
      console.log('✅ WebSocket connected to server');
    };

    socket.onmessage = (event) => {
      const message = event.data;
      console.log('Received message:', message);

      // Handle transcription (user speech)
      if (message.startsWith('✅ You:')) {
        const text = message.replace('✅ You:', '').trim();
        addMessage('user', text);

      // Handle AI response text
      } else if (message.startsWith('🤖')) {
        const text = message.replace('🤖', '').trim();
        addMessage('ai', text);

      // Handle base64 audio chunks
      } else if (message.startsWith('audio_chunk:')) {
        const base64Chunk = message.slice('audio_chunk:'.length);


        console.log('Received base64 audio chunk:', base64Chunk);

        
        // 🔥 Accumulate in array
        audioChunks.push(base64Chunk);
        
        // ✅ Print acknowledgment to console
        console.log('✅ Audio chunk received by client:', base64Chunk.substring(0, 50) + '...');

      // Handle errors
      } else if (message.startsWith('error:')) {
        const errorMsg = message.slice('error:'.length);
        console.error('❌ Server error:', errorMsg);
        addMessage('ai', `<span class="text-red-300">Error: ${errorMsg}</span>`);
      }
    };

    socket.onerror = (err) => {
      console.error('❌ WebSocket error:', err);
      statusDiv.textContent = 'Connection Error';
      connectionDiv.textContent = 'Error';
      connectionDiv.className = 'text-sm text-red-400 mt-1';
    };

    socket.onclose = () => {
      console.log('🔌 WebSocket closed');
      connectionDiv.textContent = 'Disconnected';
      connectionDiv.className = 'text-sm text-gray-500 mt-1';
    };

    // Get microphone stream
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        sampleRate: 16000,
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true
      }
    });

    // Setup Web Audio API
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(mediaStream);
    processor = audioContext.createScriptProcessor(4096, 1, 1);

    processor.onaudioprocess = (e) => {
      if (!isRecording || !socket || socket.readyState !== WebSocket.OPEN) return;

      const inputData = e.inputBuffer.getChannelData(0);
      const resampled = resampleTo16kHz(inputData, audioContext.sampleRate);
      const pcmData = floatTo16BitPCM(resampled);
      socket.send(pcmData); // Send raw PCM to server
    };

    source.connect(processor);
    processor.connect(audioContext.destination);

    isRecording = true;
    statusDiv.textContent = '🎤 Recording...';
    startBtn.disabled = true;
    stopBtn.disabled = false;

    console.log('✅ Recording started. Sample Rate:', audioContext.sampleRate);

  } catch (error) {
    console.error('❌ Failed to start recording:', error);
    statusDiv.textContent = 'Error: ' + error.message;
    connectionDiv.textContent = 'Error';
    connectionDiv.className = 'text-sm text-red-400 mt-1';
  }
}

// Stop Recording
function stopRecording() {
  console.log('⏹️ Stopping recording...');
  isRecording = false;

  if (socket) {
    socket.close();
    socket = null;
  }

  if (processor) {
    processor.disconnect();
    processor = null;
  }

  if (audioContext) {
    audioContext.close();
    audioContext = null;
  }

  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
  }

  statusDiv.textContent = 'Stopped';
  startBtn.disabled = false;
  stopBtn.disabled = true;

  // Enable play button if audio was received
  if (audioChunks.length > 0) {
    playAudioBtn.classList.remove('hidden');
    playAudioBtn.disabled = false;
  }

  console.log(`📊 Total transcripts: ${transcriptCount}`);
  console.log(`🔊 Audio chunks received: ${audioChunks.length}`);
}

// Play accumulated audio (for demo)
playAudioBtn.addEventListener('click', () => {
  const fullBase64 = audioChunks.join('');
  const binaryString = atob(fullBase64);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }
  const blob = new Blob([bytes], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob);
  const audio = new Audio(url);
  audio.play();
});

// Event Listeners
startBtn.addEventListener('click', startRecording);
stopBtn.addEventListener('click', stopRecording);

// Cleanup on unload
window.addEventListener('beforeunload', () => {
  if (isRecording) stopRecording();
});

// Ready
console.log('🚀 Day 21: Streaming Audio to Client | Ready!');
console.log(`📱 Session ID: ${SESSION_ID}`);
</script>
</body>
</html>
